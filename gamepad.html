<!doctype html>
<html lang="zh-Hant">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gamepad Diagnostic</title>
<style>
  body{margin:0;padding:24px;background:#0b0d12;color:#e8eaf0;font:14px/1.5 ui-monospace,Consolas,monospace}
  h1{font-size:18px;margin:0 0 4px}h2{font-size:14px;margin:20px 0 8px;color:#9aa3b5}
  #status{font-size:28px;font-weight:700;margin:12px 0;color:#ffb020}#status[data-state=on]{color:#4ed8b5}
  .pad{border:1px solid #2a3040;padding:12px;margin:8px 0}.pad dl{display:grid;grid-template-columns:max-content 1fr;gap:2px 16px;margin:0 0 8px}.pad dt{color:#9aa3b5}.pad dd{margin:0;word-break:break-all}
  .cells{display:flex;flex-wrap:wrap;gap:6px}.cell{min-width:64px;padding:4px 8px;border:1px solid #2a3040;text-align:center}.cell.on{background:#e0213a;border-color:#e0213a;color:#fff}
  table{border-collapse:collapse}td,th{padding:3px 10px;border-bottom:1px solid #2a3040;text-align:left}
  button,input,select{font:inherit;background:#1a1f2b;color:inherit;border:1px solid #3a4258;padding:3px 10px}button{cursor:pointer}button.wait{background:#ffb020;color:#000}input[type=number]{width:70px}
  #log,#json{width:100%;height:180px;box-sizing:border-box;background:#06070a;color:#b9c2d6;border:1px solid #2a3040;overflow:auto;white-space:pre;margin:0;padding:8px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
</style></head>
<body>
  <h1>Gamepad Diagnostic · Experience 3</h1>
  <div>先按一下搖桿上的任一按鍵，瀏覽器才會回報裝置。Qanba 預設測試設定：COMPATIBILITY PC · MODE DP · TURBO OFF。</div>
  <div id="status" role="status" data-state="waiting">WAITING FOR GAMEPAD</div>
  <div id="live"></div>
  <h2>MAPPING PROFILE</h2><div id="controls"></div>
  <h2>EVENT LOG</h2><pre id="log"></pre>
  <h2>DIAGNOSTIC JSON</h2>
  <div class="row"><label>備註 <input id="note" size="40" placeholder="例：PC / DP / TURBO OFF / Chrome"></label><button id="export">匯出 JSON</button></div>
  <textarea id="json" readonly></textarea>
  <script type="module" src="/src/input/diagnostic.ts"></script>
</body>
</html>
